name: Publish Windows NVIDIA Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version or label, for example v0.1.0
        required: true
        type: string
      package_name:
        description: Uploaded release artifact name prefix
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-github-release:
    name: Publish GitHub release
    runs-on: self-hosted

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.package_name }}-${{ inputs.version }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ inputs.version }}
          name: VidSmoother ${{ inputs.version }} Windows 11 NVIDIA
          files: release-assets/*
          make_latest: false
          prerelease: true
          generate_release_notes: true
