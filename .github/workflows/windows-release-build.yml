name: Build Windows NVIDIA Release Package

on:
  workflow_call:
    inputs:
      version:
        description: Release version or label, for example v0.1.0
        required: true
        type: string
      python_version:
        description: Python version to embed, for example 3.12
        required: true
        type: string
      ffmpeg_release:
        description: BtbN/FFmpeg-Builds release tag, or latest
        required: true
        type: string
      vapoursynth_release:
        description: VapourSynth PyPI version, release tag like R74, or latest
        required: true
        type: string
      python_package_cache_version:
        description: Bump this to refresh cached Python build/runtime packages
        required: true
        type: string
      ignore_workflow_changes_for_caching:
        description: Reuse the Python build/runtime cache even if workflow files changed
        required: true
        type: boolean
      lsmash_release:
        description: HomeOfAviSynthPlusEvolution/L-SMASH-Works release tag, or latest
        required: true
        type: string

permissions:
  contents: read

env:
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
  NVIDIA_PYPI_URL: https://pypi.nvidia.com
  PACKAGE_NAME: VidSmoother-windows11-nvidia
  PIP_CACHE_DIR: ${{ github.workspace }}\.cache\pip
  PYINSTALLER_CACHE_DIR: ${{ github.workspace }}\.cache\pyinstaller
  PYINSTALLER_WORKPATH: ${{ github.workspace }}\.cache\pyinstaller\build
  PYINSTALLER_SPECPATH: ${{ github.workspace }}\.cache\pyinstaller\spec
  PYTHON_PACKAGE_ARCHIVE_DIR: ${{ github.workspace }}\.cache\python-package-archive
  PYTHON_PACKAGE_WHEELHOUSE: ${{ github.workspace }}\.cache\python-package-archive\wheelhouse

jobs:
  build-windows-release:
    name: Build and package Windows 11 NVIDIA exe
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Put Git Unix tools on PATH
        shell: pwsh
        run: |
          $gitUsrBin = "C:\Program Files\Git\usr\bin"
          if (Test-Path $gitUsrBin) {
            "$gitUsrBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
          } else {
            Write-Warning "Git usr\bin was not found at $gitUsrBin; cache compression may fail if gzip is unavailable."
          }

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Cache append-only Python package artifacts
        uses: actions/cache@v5.0.5
        with:
          path: |
            .cache/pip
            .cache/python-package-archive
          key: python-package-artifacts-${{ runner.os }}-py-${{ inputs.python_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            python-package-artifacts-${{ runner.os }}-py-${{ inputs.python_version }}-

      - name: Cache selected release downloads
        if: ${{ inputs.ffmpeg_release != 'latest' && inputs.lsmash_release != 'latest' }}
        uses: actions/cache@v5.0.5
        with:
          path: .cache/release-downloads
          key: release-downloads-${{ runner.os }}-ffmpeg-${{ inputs.ffmpeg_release }}-lsmash-${{ inputs.lsmash_release }}

      - name: Compute workflow cache fingerprint
        id: workflow-cache-fingerprint
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.ignore_workflow_changes_for_caching }}" -eq "true") {
            "value=ignored" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
            Write-Host "Ignoring workflow file changes when computing the Python build/runtime cache key."
          } else {
            $workflowFiles = @(
              ".github\workflows\windows-release.yml",
              ".github\workflows\windows-release-build.yml"
            )
            $workflowHashes = foreach ($workflowFile in $workflowFiles) {
              $workflowPath = Join-Path $env:GITHUB_WORKSPACE $workflowFile
              if (Test-Path $workflowPath) {
                "$workflowFile=$((Get-FileHash -Algorithm SHA256 -Path $workflowPath).Hash.ToLowerInvariant())"
              }
            }
            $fingerprintFile = Join-Path $env:RUNNER_TEMP "workflow-cache-fingerprint.txt"
            $workflowHashes | Set-Content -Path $fingerprintFile -Encoding ASCII
            $workflowHash = (Get-FileHash -Algorithm SHA256 -Path $fingerprintFile).Hash.ToLowerInvariant()
            "value=$workflowHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          }

      - name: Cache PyInstaller work files
        uses: actions/cache@v5.0.5
        with:
          path: ${{ env.PYINSTALLER_CACHE_DIR }}
          key: pyinstaller-${{ inputs.python_package_cache_version }}-${{ runner.os }}-py-${{ inputs.python_version }}-${{ hashFiles('ui_main.py', 'main.py', 'vidsmoother/**/*.py', 'extern/vs-rife/**/*.py', 'requirements-ui.txt', 'requirements-trt.txt', 'requirements-release-lock.txt', 'extern/vs-rife/pyproject.toml') }}-${{ steps.workflow-cache-fingerprint.outputs.value }}

      - name: Prepare build layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = Join-Path $env:RUNNER_TEMP "bundle"
          $runtimePython = Join-Path $bundleRoot "python\site-packages"
          New-Item -ItemType Directory -Force -Path $env:PYINSTALLER_WORKPATH, $env:PYINSTALLER_SPECPATH | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "libs\ffmpeg") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "libs\vapoursynth\vs-plugins") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "python-runtime") | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimePython | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "python-scripts") | Out-Null
          "BUNDLE_ROOT=$bundleRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUNTIME_SITE_PACKAGES=$runtimePython" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Python build and runtime packages
        id: python-package-cache
        uses: actions/cache@v5.0.5
        with:
          path: |
            .venv-build
            ${{ runner.temp }}\bundle\python\site-packages
            ${{ runner.temp }}\bundle\python-scripts
          key: python-build-runtime-${{ inputs.python_package_cache_version }}-${{ runner.os }}-py-${{ inputs.python_version }}-torch-cu130-vs-${{ inputs.vapoursynth_release }}-${{ hashFiles('requirements-ui.txt', 'requirements-trt.txt', 'requirements-release-lock.txt', 'extern/vs-rife/pyproject.toml') }}-${{ steps.workflow-cache-fingerprint.outputs.value }}

      - name: Resolve selected release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-GitHubRelease {
            param(
              [Parameter(Mandatory)] [string] $Repository,
              [Parameter(Mandatory)] [string] $Tag
            )
            $headers = @{
              "Accept" = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
              "User-Agent" = "VidSmoother-Release-Build"
            }
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
              $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
            }
            if ($Tag -eq "latest") {
              $uri = "https://api.github.com/repos/$Repository/releases/latest"
            } else {
              $uri = "https://api.github.com/repos/$Repository/releases/tags/$Tag"
            }
            Invoke-RestMethod -Headers $headers -Uri $uri
          }

          function Save-ReleaseAsset {
            param(
              [Parameter(Mandatory)] [string] $Repository,
              [Parameter(Mandatory)] [string] $Tag,
              [Parameter(Mandatory)] [string] $AssetPattern,
              [Parameter(Mandatory)] [string] $Destination
            )
            $release = Get-GitHubRelease -Repository $Repository -Tag $Tag
            $asset = $release.assets | Where-Object { $_.name -match $AssetPattern } | Select-Object -First 1
            if ($null -eq $asset) {
              $names = ($release.assets | ForEach-Object { $_.name }) -join ", "
              throw "No asset matching '$AssetPattern' found in $Repository release '$($release.tag_name)'. Assets: $names"
            }
            if (Test-Path $Destination) {
              $cachedAsset = Get-Item $Destination
              if ($cachedAsset.Length -gt 0) {
                Write-Host "Using cached $($asset.name): $Destination"
              } else {
                Write-Host "Cached file was empty; re-downloading $($asset.name)."
                Invoke-WebRequest -Headers @{ "User-Agent" = "VidSmoother-Release-Build" } -Uri $asset.browser_download_url -OutFile $Destination
              }
            } else {
              Invoke-WebRequest -Headers @{ "User-Agent" = "VidSmoother-Release-Build" } -Uri $asset.browser_download_url -OutFile $Destination
            }
            $envPrefix = ($Repository -replace "[^A-Za-z0-9]", "_").ToUpperInvariant()
            "$($envPrefix)_TAG=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Append
            "$($envPrefix)_ASSET=$($asset.name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          $downloadDir = Join-Path $env:GITHUB_WORKSPACE ".cache\release-downloads"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null

          Save-ReleaseAsset `
            -Repository "BtbN/FFmpeg-Builds" `
            -Tag "${{ inputs.ffmpeg_release }}" `
            -AssetPattern "^ffmpeg-.*-win64-gpl(?:-[0-9.]+)?\.zip$" `
            -Destination (Join-Path $downloadDir "ffmpeg.zip")

          $vapourSynthInput = "${{ inputs.vapoursynth_release }}"
          if ($vapourSynthInput -eq "latest") {
            "VAPOURSYNTH_PACKAGE_SPEC=vapoursynth" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VAPOURSYNTH_VERSION_LABEL=latest" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $vapourSynthVersion = $vapourSynthInput -replace "^[Rr]", ""
            "VAPOURSYNTH_PACKAGE_SPEC=vapoursynth==$vapourSynthVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VAPOURSYNTH_VERSION_LABEL=$vapourSynthInput" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          Save-ReleaseAsset `
            -Repository "HomeOfAviSynthPlusEvolution/L-SMASH-Works" `
            -Tag "${{ inputs.lsmash_release }}" `
            -AssetPattern "^L-SMASH-Works-.*\.7z$" `
            -Destination (Join-Path $downloadDir "lsmash.7z")

      - name: Extract binary tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $downloadDir = Join-Path $env:GITHUB_WORKSPACE ".cache\release-downloads"
          $extractDir = Join-Path $env:RUNNER_TEMP "extracted"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Expand-Archive -Path (Join-Path $downloadDir "ffmpeg.zip") -DestinationPath (Join-Path $extractDir "ffmpeg") -Force
          $ffmpegBin = Get-ChildItem -Path (Join-Path $extractDir "ffmpeg") -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeBin = Get-ChildItem -Path (Join-Path $extractDir "ffmpeg") -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($null -eq $ffmpegBin -or $null -eq $ffprobeBin) {
            throw "FFmpeg release did not contain ffmpeg.exe and ffprobe.exe."
          }
          Copy-Item -Path $ffmpegBin.FullName, $ffprobeBin.FullName -Destination (Join-Path $env:BUNDLE_ROOT "libs\ffmpeg")

          7z x (Join-Path $downloadDir "lsmash.7z") "-o$(Join-Path $extractDir "lsmash")" -y
          $lsmashPlugin = Get-ChildItem -Path (Join-Path $extractDir "lsmash") -Recurse -Include "*lsmash*.dll", "LSMASHSource.dll" |
            Where-Object { $_.FullName -match "\\x64\\" -or $_.DirectoryName -match "x64|VapourSynth" } |
            Select-Object -First 1
          if ($null -eq $lsmashPlugin) {
            $lsmashPlugin = Get-ChildItem -Path (Join-Path $extractDir "lsmash") -Recurse -Include "*lsmash*.dll", "LSMASHSource.dll" | Select-Object -First 1
          }
          if ($null -eq $lsmashPlugin) {
            throw "L-SMASH-Works release did not contain a VapourSynth plugin dll."
          }
          Copy-Item -Path $lsmashPlugin.FullName -Destination (Join-Path $env:BUNDLE_ROOT "libs\vapoursynth\vs-plugins")

      - name: Install Python build and runtime packages
        shell: pwsh
        env:
          PYTHON_PACKAGE_CACHE_HIT: ${{ steps.python-package-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $python = ".\.venv-build\Scripts\python.exe"
          $scriptsDir = ".\.venv-build\Scripts"
          $vapourSynthPackage = Join-Path $env:RUNTIME_SITE_PACKAGES "vapoursynth"
          $vapourSynthBundle = Join-Path $env:BUNDLE_ROOT "libs\vapoursynth"
          $bundleScriptsDir = Join-Path $env:BUNDLE_ROOT "python-scripts"
          $constraintsFile = Join-Path $env:GITHUB_WORKSPACE "requirements-release-lock.txt"
          $cuda12RuntimePackages = @(
            "cutensor-cu12",
            "nvidia-cublas-cu12",
            "nvidia-cuda-nvrtc-cu12",
            "nvidia-cuda-runtime-cu12",
            "nvidia-cudnn-cu12",
            "nvidia-cufft-cu12",
            "nvidia-cusolver-cu12",
            "nvidia-cusparse-cu12",
            "nvidia-nvjitlink-cu12"
          )

          if ("${{ inputs.vapoursynth_release }}" -eq "latest") {
            $constraintsFile = Join-Path $env:RUNNER_TEMP "requirements-release-lock-vapoursynth-latest.txt"
            Get-Content (Join-Path $env:GITHUB_WORKSPACE "requirements-release-lock.txt") |
              Where-Object { $_ -notmatch "^VapourSynth==" } |
              Set-Content -Path $constraintsFile -Encoding ASCII
          }

          $pipConstraints = @("-c", $constraintsFile)

          function Get-PipDownloadArguments {
            param([Parameter(Mandatory)] [string[]] $Arguments)

            $downloadArguments = @()
            for ($index = 0; $index -lt $Arguments.Count; $index++) {
              $argument = $Arguments[$index]
              if ($argument -in @("--upgrade", "-U")) {
                continue
              }
              if ($argument -eq "--target") {
                $index++
                continue
              }
              if ($argument.StartsWith("--target=")) {
                continue
              }
              $downloadArguments += $argument
            }

            return $downloadArguments
          }

          function Invoke-PipDownloadArchive {
            param(
              [Parameter(Mandatory)] [string] $PythonExe,
              [Parameter(Mandatory)] [string[]] $Arguments,
              [switch] $NoDependencies
            )

            New-Item -ItemType Directory -Force -Path $env:PYTHON_PACKAGE_WHEELHOUSE | Out-Null
            $downloadArguments = @(Get-PipDownloadArguments -Arguments $Arguments)
            if ($downloadArguments.Count -eq 0) {
              return
            }
            $downloadArguments = @(
              "--extra-index-url", $env:TORCH_INDEX_URL,
              "--extra-index-url", $env:NVIDIA_PYPI_URL
            ) + $downloadArguments
            if ($NoDependencies) {
              $downloadArguments = @("--no-deps") + $downloadArguments
            }

            & $PythonExe -m pip download --dest $env:PYTHON_PACKAGE_WHEELHOUSE @downloadArguments
          }

          function Invoke-PipInstallWithArchive {
            param(
              [Parameter(Mandatory)] [string] $PythonExe,
              [Parameter(Mandatory)] [string[]] $Arguments
            )

            Invoke-PipDownloadArchive -PythonExe $PythonExe -Arguments $Arguments
            & $PythonExe -m pip install @Arguments
          }

          function Save-PipInstalledPackageArtifacts {
            param(
              [Parameter(Mandatory)] [string] $PythonExe,
              [Parameter(Mandatory)] [string] $Scope,
              [string[]] $ListArguments = @()
            )

            $manifestDir = Join-Path $env:PYTHON_PACKAGE_ARCHIVE_DIR "manifests"
            New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
            New-Item -ItemType Directory -Force -Path $env:PYTHON_PACKAGE_WHEELHOUSE | Out-Null

            $safeScope = ($Scope.ToLowerInvariant() -replace "[^a-z0-9._-]", "-").Trim("-")
            if ([string]::IsNullOrWhiteSpace($safeScope)) {
              $safeScope = "packages"
            }
            $timestamp = (Get-Date).ToUniversalTime().ToString("yyyyMMddTHHmmssfffffffZ")
            $manifest = Join-Path $manifestDir "$timestamp-$safeScope.txt"

            & $PythonExe -m pip list --format=freeze @ListArguments | Set-Content -Path $manifest -Encoding ASCII
            $manifestPackages = @(Get-Content $manifest | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($manifestPackages.Count -eq 0) {
              return
            }

            try {
              & $PythonExe -m pip download `
                --dest $env:PYTHON_PACKAGE_WHEELHOUSE `
                --no-deps `
                --requirement $manifest `
                --extra-index-url $env:TORCH_INDEX_URL `
                --extra-index-url $env:NVIDIA_PYPI_URL
            } catch {
              Write-Warning "Could not archive every package from $Scope via pip download. The manifest was preserved at $manifest. $($_.Exception.Message)"
              $global:LASTEXITCODE = 0
            }
          }

          if ($env:PYTHON_PACKAGE_CACHE_HIT -eq "true") {
            Write-Host "Using cached Python build and runtime packages."

            if (-not (Test-Path $python)) {
              throw "Python package cache was restored, but .venv-build is missing python.exe."
            }

            & $python -m pip check

            if (-not (Test-Path (Join-Path $vapourSynthPackage "vspipe.exe"))) {
              throw "Cached runtime site-packages did not contain VapourSynth vspipe.exe."
            }

            Copy-Item -Recurse -Force -Path (Join-Path $vapourSynthPackage "*") -Destination $vapourSynthBundle

            if (-not (Test-Path (Join-Path $bundleScriptsDir "vapoursynth.exe"))) {
              throw "Cached python-scripts did not contain vapoursynth.exe."
            }

            if (-not (Test-Path (Join-Path $bundleScriptsDir "vspipe.exe"))) {
              Write-Host "vspipe.exe was not found in python-scripts; bundled VapourSynth copy will be used from libs\vapoursynth."
            }

            Save-PipInstalledPackageArtifacts -PythonExe $python -Scope "build-venv-cache-hit"
            Save-PipInstalledPackageArtifacts -PythonExe $python -Scope "runtime-site-packages-cache-hit" -ListArguments @("--path", $env:RUNTIME_SITE_PACKAGES)
            return
          }

          python -m venv .venv-build

          Save-PipInstalledPackageArtifacts -PythonExe $python -Scope "build-venv-initial"

          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @("pip", "packaging", "setuptools", "wheel", "hatchling", "pyinstaller"))
          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @("-r", "requirements-ui.txt"))

          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @(
            "torch", "torchvision", "torch_tensorrt",
            "--extra-index-url", $env:TORCH_INDEX_URL,
            "--extra-index-url", $env:NVIDIA_PYPI_URL
          ))

          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @(
            "torch", "torchvision", "torch_tensorrt",
            "--extra-index-url", $env:TORCH_INDEX_URL,
            "--extra-index-url", $env:NVIDIA_PYPI_URL
          ))

          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @("--no-build-isolation", $env:VAPOURSYNTH_PACKAGE_SPEC, ".\extern\vs-rife"))

          & $python -m pip check

          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @(
            "--no-build-isolation",
            "--target", $env:RUNTIME_SITE_PACKAGES,
            "packaging", "setuptools", "wheel", $env:VAPOURSYNTH_PACKAGE_SPEC, ".\extern\vs-rife",
            "-r", "requirements-ui.txt",
            "--extra-index-url", $env:TORCH_INDEX_URL,
            "--extra-index-url", $env:NVIDIA_PYPI_URL
          ))

          if (-not (Test-Path (Join-Path $vapourSynthPackage "vspipe.exe"))) {
            throw "Installed VapourSynth package did not contain vspipe.exe."
          }

          Copy-Item -Recurse -Force -Path (Join-Path $vapourSynthPackage "*") -Destination $vapourSynthBundle

          # Preserve venv Scripts because VapourSynth installs vapoursynth.exe there.
          New-Item -ItemType Directory -Force -Path $bundleScriptsDir | Out-Null
          Copy-Item -Recurse -Force -Path (Join-Path $scriptsDir "*") -Destination $bundleScriptsDir

          if (-not (Test-Path (Join-Path $bundleScriptsDir "vapoursynth.exe"))) {
            throw "vapoursynth.exe was not copied into bundled python-scripts."
          }

          if (-not (Test-Path (Join-Path $bundleScriptsDir "vspipe.exe"))) {
            Write-Host "vspipe.exe was not found in python-scripts; bundled VapourSynth copy will be used from libs\vapoursynth."
          }

          # Bundle modelopt into the runtime site-packages only. The build venv does not need it,
          # and installing it there can trigger resolver issues against the pinned Torch build.
          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @(
            "nvidia-modelopt[all]", "triton-windows"
          ) + $cuda12RuntimePackages + @(
            "--target", $env:RUNTIME_SITE_PACKAGES,
            "--extra-index-url", $env:TORCH_INDEX_URL,
            "--extra-index-url", $env:NVIDIA_PYPI_URL
          ))

          Invoke-PipInstallWithArchive -PythonExe $python -Arguments (@("--upgrade") + $pipConstraints + @(
            "--target", $env:RUNTIME_SITE_PACKAGES,
            "torch", "torchvision", "torch_tensorrt",
            "--extra-index-url", $env:TORCH_INDEX_URL,
            "--extra-index-url", $env:NVIDIA_PYPI_URL
          ))

          Save-PipInstalledPackageArtifacts -PythonExe $python -Scope "build-venv-final"
          Save-PipInstalledPackageArtifacts -PythonExe $python -Scope "runtime-site-packages-final" -ListArguments @("--path", $env:RUNTIME_SITE_PACKAGES)

          # Copy Scripts again after Torch install in case additional runtime executables/DLL-adjacent launchers were added.
          Copy-Item -Recurse -Force -Path (Join-Path $scriptsDir "*") -Destination $bundleScriptsDir

      - name: Install VapourSynth misc plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Native {
            param(
              [Parameter(Mandatory)] [string] $FilePath,
              [Parameter(ValueFromRemainingArguments = $true)] [string[]] $Arguments
            )

            & $FilePath @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed with exit code $LASTEXITCODE`: $FilePath $($Arguments -join ' ')"
            }
          }

          $python = ".\.venv-build\Scripts\python.exe"
          $scriptsDir = Split-Path $python
          $vsrepo = Join-Path $scriptsDir "vsrepo.exe"
          $constraintsFile = Join-Path $env:GITHUB_WORKSPACE "requirements-release-lock.txt"

          if ("${{ inputs.vapoursynth_release }}" -eq "latest") {
            $constraintsFile = Join-Path $env:RUNNER_TEMP "requirements-release-lock-vapoursynth-latest.txt"
            Get-Content (Join-Path $env:GITHUB_WORKSPACE "requirements-release-lock.txt") |
              Where-Object { $_ -notmatch "^VapourSynth==" } |
              Set-Content -Path $constraintsFile -Encoding ASCII
          }

          $pipConstraints = @("-c", $constraintsFile)

          New-Item -ItemType Directory -Force -Path $env:PYTHON_PACKAGE_WHEELHOUSE | Out-Null
          Invoke-Native $python -m pip download --dest $env:PYTHON_PACKAGE_WHEELHOUSE @pipConstraints vsrepo
          Invoke-Native $python -m pip install --upgrade @pipConstraints vsrepo

          if (-not (Test-Path $vsrepo)) {
            throw "vsrepo.exe was not found after installing vsrepo: $vsrepo"
          }

          # vsrife uses misc.SCDetect for scene-change detection.
          # That namespace comes from MiscFilters.dll.
          Invoke-Native $vsrepo update
          Invoke-Native $vsrepo install misc

          $vsPluginDir = & $python -c "import vapoursynth as vs; print(vs.get_plugin_dir())"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve VapourSynth plugin dir."
          }

          $vsPluginDir = $vsPluginDir.Trim()
          if (-not (Test-Path $vsPluginDir)) {
            throw "VapourSynth plugin dir does not exist: $vsPluginDir"
          }

          $miscPlugin = Get-ChildItem -Path $vsPluginDir -Recurse -Include "MiscFilters.dll", "*Misc*.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $miscPlugin) {
            Write-Host "Plugin dir contents:"
            Get-ChildItem -Path $vsPluginDir -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host $_.FullName
            }
            throw "vsrepo install misc completed, but MiscFilters.dll was not found in: $vsPluginDir"
          }

          $bundlePluginDir = Join-Path $env:BUNDLE_ROOT "libs\vapoursynth\vs-plugins"
          New-Item -ItemType Directory -Force -Path $bundlePluginDir | Out-Null
          Copy-Item -Force -Path $miscPlugin.FullName -Destination $bundlePluginDir

          Write-Host "Bundled VapourSynth misc plugin:"
          Write-Host "$($miscPlugin.FullName) -> $bundlePluginDir"

      - name: Copy embedded Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pythonHome = python -c "import sys; print(sys.base_prefix)"
          $runtimeRoot = Join-Path $env:BUNDLE_ROOT "python-runtime"
          Copy-Item -Recurse -Force -Path (Join-Path $pythonHome "DLLs") -Destination $runtimeRoot
          Copy-Item -Recurse -Force -Path (Join-Path $pythonHome "Lib") -Destination $runtimeRoot
          Copy-Item -Force -Path (Join-Path $pythonHome "python.exe") -Destination $runtimeRoot
          Copy-Item -Force -Path (Join-Path $pythonHome "pythonw.exe") -Destination $runtimeRoot -ErrorAction SilentlyContinue
          Copy-Item -Force -Path (Join-Path $pythonHome "python*.dll") -Destination $runtimeRoot
          Copy-Item -Force -Path (Join-Path $pythonHome "python*.*") -Destination $runtimeRoot -ErrorAction SilentlyContinue
          Copy-Item -Force -Path (Join-Path $pythonHome "vcruntime*.dll") -Destination $runtimeRoot -ErrorAction SilentlyContinue

      - name: Build onedir app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = ".\.venv-build\Scripts\python.exe"

          function Get-PythonPackageDllDirs {
            param([Parameter(Mandatory)] [string] $SitePackages)

            $packageRoots = @(
              "torch",
              "nvidia",
              "cutensor",
              "onnxruntime",
              "cupy",
              "cupy_backends"
            )
            $dllDirs = [ordered]@{}

            foreach ($packageRoot in $packageRoots) {
              $root = Join-Path $SitePackages $packageRoot
              if (-not (Test-Path $root)) {
                continue
              }

              Get-ChildItem -Path $root -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
                $resolved = (Resolve-Path $_.DirectoryName).Path
                $dllDirs[$resolved.ToLowerInvariant()] = $resolved
              }
            }

            return @($dllDirs.Values)
          }

          $runtimeSitePackages = Join-Path $env:BUNDLE_ROOT "python\site-packages"
          $packageDllDirs = @(Get-PythonPackageDllDirs -SitePackages $runtimeSitePackages)
          if ($packageDllDirs.Count -gt 0) {
            Write-Host "Adding Python package DLL dirs to PyInstaller PATH:"
            $packageDllDirs | ForEach-Object { Write-Host "  $_" }
            $env:PATH = (($packageDllDirs + @($env:PATH)) -join ";")
          }

          & $python -m PyInstaller `
            --onedir `
            --name VidSmoother `
            --workpath "$env:PYINSTALLER_WORKPATH" `
            --specpath "$env:PYINSTALLER_SPECPATH" `
            --paths ".\extern\vs-rife" `
            --collect-all reactpy `
            --collect-all starlette `
            --collect-all uvicorn `
            --collect-all anyio `
            --collect-all colorlog `
            --hidden-import reactpy.backend.starlette `
            --hidden-import colorlog `
            --hidden-import colorlog.escape_codes `
            --add-data "$env:BUNDLE_ROOT\libs;libs" `
            --add-data "$env:BUNDLE_ROOT\python;python" `
            --add-data "$env:BUNDLE_ROOT\python-runtime;python-runtime" `
            --add-data "$env:BUNDLE_ROOT\python-scripts;python-scripts" `
            ".\ui_main.py"

      - name: Configure bundled VapourSynth Python binding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Escape-TomlString {
            param([Parameter(Mandatory)] [string] $Value)
            return '"' + $Value.Replace('\', '\\') + '"'
          }

          function Write-VapourSynthConfig {
            param(
              [Parameter(Mandatory)] [string] $VSScriptPath,
              [Parameter(Mandatory)] [string] $PythonExe,
              [Parameter(Mandatory)] [string] $PythonSymbolPath
            )

            $configDir = Join-Path $env:APPDATA "vapoursynth"
            New-Item -ItemType Directory -Force -Path $configDir | Out-Null

            $configPath = Join-Path $configDir "vapoursynth.toml"
            $vsscriptKey = (Resolve-Path $VSScriptPath).Path.ToLowerInvariant()
            $pythonExePath = (Resolve-Path $PythonExe).Path
            $pythonSymbol = (Resolve-Path $PythonSymbolPath).Path

            $line = "$(Escape-TomlString $vsscriptKey) = [$(Escape-TomlString $pythonExePath),$(Escape-TomlString $pythonSymbol)]"
            $line | Set-Content -Path $configPath -Encoding UTF8
            Write-Host "Configuration written to $configPath for $vsscriptKey"
          }

          function Get-PythonSymbolPath {
            param([Parameter(Mandatory)] [string] $PythonExe)

            $script = @'
          import ctypes
          from ctypes.wintypes import DWORD, HMODULE, LPWSTR

          kernel32 = ctypes.WinDLL("kernel32.dll")
          get_module_file_name = kernel32.GetModuleFileNameW
          get_module_file_name.argtypes = [HMODULE, LPWSTR, DWORD]
          get_module_file_name.restype = DWORD

          buffer = ctypes.create_unicode_buffer(32768)
          result = get_module_file_name(ctypes.pythonapi._handle, buffer, len(buffer))
          if result == 0:
              raise SystemExit("Could not determine Python symbol path")
          print(buffer.value)
          '@

            $symbolPath = & $PythonExe -c $script
            if ($LASTEXITCODE -ne 0) {
              throw "Could not determine Python symbol path with $PythonExe"
            }

            $symbolPath = $symbolPath.Trim()
            if (-not (Test-Path $symbolPath)) {
              throw "Python symbol path does not exist: $symbolPath"
            }

            return $symbolPath
          }

          $appRoot = ".\dist\VidSmoother"
          $internalRoot = Join-Path $appRoot "_internal"

          if (-not (Test-Path $internalRoot)) {
            $internalRoot = $appRoot
          }

          $vsRoot = Join-Path $internalRoot "libs\vapoursynth"
          $runtimeRoot = Join-Path $internalRoot "python-runtime"
          $sitePackages = Join-Path $internalRoot "python\site-packages"

          $vspipe = Join-Path $vsRoot "vspipe.exe"
          $vsscript = Join-Path $vsRoot "vsscript.dll"
          $runtimePython = Join-Path $runtimeRoot "python.exe"

          if (-not (Test-Path $vspipe)) {
            throw "vspipe.exe not found: $vspipe"
          }

          if (-not (Test-Path $vsscript)) {
            throw "vsscript.dll not found: $vsscript"
          }

          if (-not (Test-Path $runtimePython)) {
            throw "Bundled python.exe not found: $runtimePython"
          }

          $scriptsRoot = Join-Path $internalRoot "python-scripts"

          $env:PYTHONHOME = (Resolve-Path $runtimeRoot).Path
          $env:PYTHONPATH = (Resolve-Path $sitePackages).Path
          $env:PATH = "$scriptsRoot;$runtimeRoot;$vsRoot;$sitePackages;$env:PATH"
          $env:VAPOURSYNTH_EXTRA_PLUGIN_PATH = (Resolve-Path (Join-Path $vsRoot "vs-plugins")).Path

          $vapoursynthExe = Join-Path $scriptsRoot "vapoursynth.exe"

          if (-not (Test-Path $vapoursynthExe)) {
            throw "vapoursynth.exe not found in bundled python-scripts: $vapoursynthExe"
          }

          $pythonSymbolPath = Get-PythonSymbolPath -PythonExe $runtimePython
          Write-VapourSynthConfig -VSScriptPath $vsscript -PythonExe $runtimePython -PythonSymbolPath $pythonSymbolPath

          & (Join-Path $vsRoot "vspipe.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled vspipe could not initialize VSScript"
          }

      - name: Smoke test exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\VidSmoother\VidSmoother.exe --help

          $uiOut = Join-Path $env:RUNNER_TEMP "vidsmoother-ui.out.log"
          $uiErr = Join-Path $env:RUNNER_TEMP "vidsmoother-ui.err.log"
          $uiProcess = Start-Process `
            -FilePath ".\dist\VidSmoother\VidSmoother.exe" `
            -ArgumentList "--host", "127.0.0.1", "--port", "8765", "--no-browser" `
            -RedirectStandardOutput $uiOut `
            -RedirectStandardError $uiErr `
            -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(30)
            $started = $false
            while ((Get-Date) -lt $deadline) {
              if ($uiProcess.HasExited) {
                $stdout = if (Test-Path $uiOut) { Get-Content $uiOut -Raw } else { "" }
                $stderr = if (Test-Path $uiErr) { Get-Content $uiErr -Raw } else { "" }
                throw "VidSmoother UI exited during smoke test with code $($uiProcess.ExitCode). Stdout: $stdout Stderr: $stderr"
              }

              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $started = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $started) {
              $stdout = if (Test-Path $uiOut) { Get-Content $uiOut -Raw } else { "" }
              $stderr = if (Test-Path $uiErr) { Get-Content $uiErr -Raw } else { "" }
              throw "VidSmoother UI did not respond on http://127.0.0.1:8765. Stdout: $stdout Stderr: $stderr"
            }
          } finally {
            if (-not $uiProcess.HasExited) {
              Stop-Process -Id $uiProcess.Id -Force
            }
          }

          $pluginDir = Join-Path ".\dist\VidSmoother\_internal\libs\vapoursynth\vs-plugins" ""
          if (-not (Test-Path $pluginDir)) {
            $pluginDir = Join-Path ".\dist\VidSmoother\libs\vapoursynth\vs-plugins" ""
          }

          if (-not (Get-ChildItem -Path $pluginDir -Recurse -Filter "MiscFilters.dll" -ErrorAction SilentlyContinue)) {
            throw "Bundled release is missing MiscFilters.dll"
          }

          if (-not (Get-ChildItem -Path $pluginDir -Recurse -Include "*lsmash*.dll", "LSMASHSource.dll" -ErrorAction SilentlyContinue)) {
            throw "Bundled release is missing L-SMASH VapourSynth plugin dll"
          }

          $vsRoot = ".\dist\VidSmoother\_internal\libs\vapoursynth"
          if (-not (Test-Path $vsRoot)) {
            $vsRoot = ".\dist\VidSmoother\libs\vapoursynth"
          }

          $runtimeRoot = ".\dist\VidSmoother\_internal\python-runtime"
          if (-not (Test-Path $runtimeRoot)) {
            $runtimeRoot = ".\dist\VidSmoother\python-runtime"
          }

          $sitePackages = ".\dist\VidSmoother\_internal\python\site-packages"
          if (-not (Test-Path $sitePackages)) {
            $sitePackages = ".\dist\VidSmoother\python\site-packages"
          }

          $scriptsRoot = ".\dist\VidSmoother\_internal\python-scripts"
          if (-not (Test-Path $scriptsRoot)) {
            $scriptsRoot = ".\dist\VidSmoother\python-scripts"
          }

          function Get-PythonPackageDllDirs {
            param([Parameter(Mandatory)] [string] $SitePackages)

            $packageRoots = @(
              "torch",
              "nvidia",
              "cutensor",
              "onnxruntime",
              "cupy",
              "cupy_backends"
            )
            $dllDirs = [ordered]@{}

            foreach ($packageRoot in $packageRoots) {
              $root = Join-Path $SitePackages $packageRoot
              if (-not (Test-Path $root)) {
                continue
              }

              Get-ChildItem -Path $root -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
                $resolved = (Resolve-Path $_.DirectoryName).Path
                $dllDirs[$resolved.ToLowerInvariant()] = $resolved
              }
            }

            return @($dllDirs.Values)
          }

          $packageDllDirs = @(Get-PythonPackageDllDirs -SitePackages $sitePackages)
          $packageDllPath = ($packageDllDirs | Select-Object -Unique) -join ";"
          $env:PYTHONHOME = (Resolve-Path $runtimeRoot).Path
          $env:PYTHONPATH = (Resolve-Path $sitePackages).Path
          $env:PATH = "$scriptsRoot;$runtimeRoot;$vsRoot;$sitePackages;$packageDllPath;$env:PATH"
          $env:VAPOURSYNTH_EXTRA_PLUGIN_PATH = (Resolve-Path (Join-Path $vsRoot "vs-plugins")).Path

          & (Join-Path $vsRoot "vspipe.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled vspipe could not initialize VSScript"
          }

          & (Join-Path $runtimeRoot "python.exe") -c "import torch; print(f'torch {torch.__version__} cuda {torch.version.cuda}'); assert torch.version.cuda is not None, 'Bundled torch is CPU-only; expected a CUDA build.'"
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled runtime does not contain a CUDA-enabled Torch build."
          }

          & (Join-Path $runtimeRoot "python.exe") -c "import modelopt; print('modelopt ok')"
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled runtime could not import nvidia-modelopt/modelopt."
          }

          $cupySmoke = @'
          import importlib

          modules = [
              "cupy.cuda.cufft",
              "cupy.cuda.jitify",
              "cupy_backends.cuda.libs.cublas",
              "cupy_backends.cuda.libs.cusolver",
              "cupy_backends.cuda.libs.cutensor",
              "cupyx.cusolver",
          ]
          for module in modules:
              importlib.import_module(module)

          import cupy

          device_count = cupy.cuda.runtime.getDeviceCount()
          if device_count < 1:
              raise SystemExit("CuPy loaded, but no CUDA devices were visible.")

          x = cupy.arange(8, dtype=cupy.float32)
          cupy.fft.fft(x).get()
          cupy.linalg.solve(cupy.eye(2, dtype=cupy.float32), cupy.ones(2, dtype=cupy.float32)).get()
          print(f"cupy {cupy.__version__} cuda devices {device_count}")
          '@
          & (Join-Path $runtimeRoot "python.exe") -c $cupySmoke
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled runtime could not load CuPy CUDA DLL dependencies."
          }

          $onnxRuntimeSmoke = @'
          import numpy as np
          import onnx
          from onnx import TensorProto, helper
          import onnxruntime as ort

          available = ort.get_available_providers()
          if "CUDAExecutionProvider" not in available:
              raise SystemExit(f"CUDAExecutionProvider is not available. Providers: {available}")

          graph = helper.make_graph(
              [
                  helper.make_node("Identity", ["input"], ["output"]),
              ],
              "cuda_provider_smoke",
              [helper.make_tensor_value_info("input", TensorProto.FLOAT, [1])],
              [helper.make_tensor_value_info("output", TensorProto.FLOAT, [1])],
          )
          model = helper.make_model(
              graph,
              producer_name="vidsmoother-release-smoke",
              opset_imports=[helper.make_operatorsetid("", 13)],
          )
          model.ir_version = 10

          session = ort.InferenceSession(model.SerializeToString(), providers=["CUDAExecutionProvider"])
          active = session.get_providers()
          if "CUDAExecutionProvider" not in active:
              raise SystemExit(f"CUDAExecutionProvider did not load. Active providers: {active}")

          output = session.run(None, {"input": np.array([1.0], dtype=np.float32)})[0]
          if output.tolist() != [1.0]:
              raise SystemExit(f"Unexpected ONNX Runtime output: {output!r}")

          print(f"onnxruntime {ort.__version__} CUDAExecutionProvider ok")
          '@
          & (Join-Path $runtimeRoot "python.exe") -c $onnxRuntimeSmoke
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled runtime could not load ONNX Runtime CUDAExecutionProvider."
          }

      - name: Create release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseDir = Join-Path $env:RUNNER_TEMP "release"
          Remove-Item -Recurse -Force -LiteralPath $releaseDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Recurse -Force -Path ".\dist\VidSmoother" -Destination $releaseDir

          $notes = @"
          VidSmoother Windows 11 NVIDIA package

          Included binary components:
          - Python: ${{ inputs.python_version }} embedded runtime from actions/setup-python
          - FFmpeg: $env:BTBN_FFMPEG_BUILDS_TAG ($env:BTBN_FFMPEG_BUILDS_ASSET)
          - VapourSynth: $env:VAPOURSYNTH_VERSION_LABEL Python package
          - L-SMASH-Works: $env:HOMEOFAVISYNTHPLUSEVOLUTION_L_SMASH_WORKS_TAG ($env:HOMEOFAVISYNTHPLUSEVOLUTION_L_SMASH_WORKS_ASSET)
          - MiscFilters VapourSynth plugin for misc.SCDetect / vsrife scene-change detection
          - CUDA 12 runtime/math DLL wheels for CuPy and ONNX Runtime GPU providers
          - Python runtime/packages are bundled beside VidSmoother.exe by PyInstaller onedir mode.

          Target machine requirements:
          - Windows 11
          - NVIDIA GPU with a current NVIDIA driver

          Usage:
          - Download all .7z parts.
          - Extract the .7z.001 file with 7-Zip.
          - Run VidSmoother.exe to start the local ReactPy interface.
          - Open http://127.0.0.1:8764 if your browser does not open automatically.
          - Use the Settings panel to enable dry-run or overwrite behavior before processing videos.

          This workflow is manual-only and is not triggered by pushes, pull requests, tags, or releases.
          "@
          $notes | Set-Content -Path (Join-Path $releaseDir "README.txt") -Encoding ASCII

          $archiveBaseName = "$($env:PACKAGE_NAME)-${{ inputs.version }}.7z"
          $archiveBasePath = Join-Path $env:RUNNER_TEMP $archiveBaseName

          Remove-Item -LiteralPath $archiveBasePath -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter "$archiveBaseName.*" -ErrorAction SilentlyContinue |
            Remove-Item -Force

          # Use .7z instead of .zip and split into <2GB chunks for GitHub Release asset limits.
          # 1900m leaves margin below 2,147,483,648 bytes.
          $threads = [Environment]::ProcessorCount

          Push-Location $releaseDir
          try {
            7z a `
              -t7z `
              -mx=3 `
              "-m0=LZMA2:d=32m:fb=32:mf=bt4:mt=$threads" `
              -ms=off `
              "-mmt=$threads" `
              -v1900m `
              -bb1 `
              $archiveBasePath `
              *
          } finally {
            Pop-Location
          }

          $archiveParts = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "$archiveBaseName.*" | Sort-Object Name
          if (-not $archiveParts -or $archiveParts.Count -eq 0) {
            throw "Release archive parts were not created."
          }

          foreach ($part in $archiveParts) {
            if ($part.Length -ge 2147483648) {
              throw "Archive part too large for GitHub release asset limit: $($part.FullName) is $($part.Length) bytes"
            }
          }

          "RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARCHIVE_GLOB=$env:RUNNER_TEMP\$archiveBaseName.*" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Created archive parts:"
          $archiveParts | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ inputs.version }}
          path: ${{ env.ARCHIVE_GLOB }}
          if-no-files-found: error
