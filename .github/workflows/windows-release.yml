name: Windows NVIDIA Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or label, for example v0.1.0
        required: true
        type: string
      python_version:
        description: Python version to embed, for example 3.12
        required: true
        default: "3.12"
        type: string
      ffmpeg_release:
        description: BtbN/FFmpeg-Builds release tag, or latest
        required: true
        default: autobuild-2026-05-01-13-18
        type: string
      vapoursynth_release:
        description: VapourSynth PyPI version, release tag like R74, or latest
        required: true
        default: "75"
        type: string
      python_package_cache_version:
        description: Bump this to refresh cached Python build/runtime packages
        required: true
        default: v2
        type: string
      ignore_workflow_changes_for_caching:
        description: Reuse the Python build/runtime cache even if workflow files changed
        required: true
        default: false
        type: boolean
      lsmash_release:
        description: HomeOfAviSynthPlusEvolution/L-SMASH-Works release tag, or latest
        required: true
        default: "1282"
        type: string
      publish_release:
        description: Publish a GitHub release with the built package archives
        required: true
        default: true
        type: boolean

jobs:
  build-windows-release:
    name: Build/package Windows 11 NVIDIA
    permissions:
      contents: read
    uses: ./.github/workflows/windows-release-build.yml
    with:
      version: ${{ inputs.version }}
      python_version: ${{ inputs.python_version }}
      ffmpeg_release: ${{ inputs.ffmpeg_release }}
      vapoursynth_release: ${{ inputs.vapoursynth_release }}
      python_package_cache_version: ${{ inputs.python_package_cache_version }}
      ignore_workflow_changes_for_caching: ${{ inputs.ignore_workflow_changes_for_caching }}
      lsmash_release: ${{ inputs.lsmash_release }}
    secrets: inherit

  publish-github-release:
    name: Publish GitHub release
    if: ${{ inputs.publish_release }}
    needs: build-windows-release
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/windows-release-publish.yml
    with:
      version: ${{ inputs.version }}
      package_name: VidSmoother-windows11-nvidia
    secrets: inherit
