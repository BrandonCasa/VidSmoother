name: Windows NVIDIA Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or label, for example v0.1.0
        required: true
        type: string
      python_version:
        description: Python version to embed, for example 3.12
        required: true
        default: "3.12"
        type: string
      ffmpeg_release:
        description: BtbN/FFmpeg-Builds release tag, or latest
        required: true
        default: latest
        type: string
      vapoursynth_release:
        description: VapourSynth PyPI version, release tag like R74, or latest
        required: true
        default: latest
        type: string
      lsmash_release:
        description: HomeOfAviSynthPlusEvolution/L-SMASH-Works release tag, or latest
        required: true
        default: latest
        type: string
      publish_release:
        description: Publish a GitHub release with the built exe and zip
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
  NVIDIA_PYPI_URL: https://pypi.nvidia.com
  PACKAGE_NAME: VidSmoother-windows11-nvidia

jobs:
  build-windows-release:
    name: Build Windows 11 NVIDIA exe
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Prepare build layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = Join-Path $env:RUNNER_TEMP "bundle"
          $runtimePython = Join-Path $bundleRoot "python\site-packages"
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "libs\ffmpeg") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "libs\vapoursynth\vs-plugins") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundleRoot "python-runtime") | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimePython | Out-Null
          "BUNDLE_ROOT=$bundleRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUNTIME_SITE_PACKAGES=$runtimePython" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve selected release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-GitHubRelease {
            param(
              [Parameter(Mandatory)] [string] $Repository,
              [Parameter(Mandatory)] [string] $Tag
            )
            $headers = @{
              "Accept" = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
              "User-Agent" = "VidSmoother-Release-Build"
            }
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
              $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN"
            }
            if ($Tag -eq "latest") {
              $uri = "https://api.github.com/repos/$Repository/releases/latest"
            } else {
              $uri = "https://api.github.com/repos/$Repository/releases/tags/$Tag"
            }
            Invoke-RestMethod -Headers $headers -Uri $uri
          }

          function Save-ReleaseAsset {
            param(
              [Parameter(Mandatory)] [string] $Repository,
              [Parameter(Mandatory)] [string] $Tag,
              [Parameter(Mandatory)] [string] $AssetPattern,
              [Parameter(Mandatory)] [string] $Destination
            )
            $release = Get-GitHubRelease -Repository $Repository -Tag $Tag
            $asset = $release.assets | Where-Object { $_.name -match $AssetPattern } | Select-Object -First 1
            if ($null -eq $asset) {
              $names = ($release.assets | ForEach-Object { $_.name }) -join ", "
              throw "No asset matching '$AssetPattern' found in $Repository release '$($release.tag_name)'. Assets: $names"
            }
            Invoke-WebRequest -Headers @{ "User-Agent" = "VidSmoother-Release-Build" } -Uri $asset.browser_download_url -OutFile $Destination
            $envPrefix = ($Repository -replace "[^A-Za-z0-9]", "_").ToUpperInvariant()
            "$($envPrefix)_TAG=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Append
            "$($envPrefix)_ASSET=$($asset.name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          $downloadDir = Join-Path $env:RUNNER_TEMP "downloads"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null

          Save-ReleaseAsset `
            -Repository "BtbN/FFmpeg-Builds" `
            -Tag "${{ inputs.ffmpeg_release }}" `
            -AssetPattern "^ffmpeg-master-.*-win64-gpl\.zip$" `
            -Destination (Join-Path $downloadDir "ffmpeg.zip")

          $vapourSynthInput = "${{ inputs.vapoursynth_release }}"
          if ($vapourSynthInput -eq "latest") {
            "VAPOURSYNTH_PACKAGE_SPEC=vapoursynth" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VAPOURSYNTH_VERSION_LABEL=latest" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $vapourSynthVersion = $vapourSynthInput -replace "^[Rr]", ""
            "VAPOURSYNTH_PACKAGE_SPEC=vapoursynth==$vapourSynthVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VAPOURSYNTH_VERSION_LABEL=$vapourSynthInput" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

          Save-ReleaseAsset `
            -Repository "HomeOfAviSynthPlusEvolution/L-SMASH-Works" `
            -Tag "${{ inputs.lsmash_release }}" `
            -AssetPattern "^L-SMASH-Works-.*\.7z$" `
            -Destination (Join-Path $downloadDir "lsmash.7z")

      - name: Extract binary tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloads"
          $extractDir = Join-Path $env:RUNNER_TEMP "extracted"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Expand-Archive -Path (Join-Path $downloadDir "ffmpeg.zip") -DestinationPath (Join-Path $extractDir "ffmpeg") -Force
          $ffmpegBin = Get-ChildItem -Path (Join-Path $extractDir "ffmpeg") -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeBin = Get-ChildItem -Path (Join-Path $extractDir "ffmpeg") -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($null -eq $ffmpegBin -or $null -eq $ffprobeBin) {
            throw "FFmpeg release did not contain ffmpeg.exe and ffprobe.exe."
          }
          Copy-Item -Path $ffmpegBin.FullName, $ffprobeBin.FullName -Destination (Join-Path $env:BUNDLE_ROOT "libs\ffmpeg")

          7z x (Join-Path $downloadDir "lsmash.7z") "-o$(Join-Path $extractDir "lsmash")" -y
          $lsmashPlugin = Get-ChildItem -Path (Join-Path $extractDir "lsmash") -Recurse -Include "*lsmash*.dll", "LSMASHSource.dll" |
            Where-Object { $_.FullName -match "\\x64\\" -or $_.DirectoryName -match "x64|VapourSynth" } |
            Select-Object -First 1
          if ($null -eq $lsmashPlugin) {
            $lsmashPlugin = Get-ChildItem -Path (Join-Path $extractDir "lsmash") -Recurse -Include "*lsmash*.dll", "LSMASHSource.dll" | Select-Object -First 1
          }
          if ($null -eq $lsmashPlugin) {
            throw "L-SMASH-Works release did not contain a VapourSynth plugin dll."
          }
          Copy-Item -Path $lsmashPlugin.FullName -Destination (Join-Path $env:BUNDLE_ROOT "libs\vapoursynth\vs-plugins")

      - name: Install Python build and runtime packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv-build
          $python = ".\.venv-build\Scripts\python.exe"
          & $python -m pip install --upgrade pip packaging setuptools wheel pyinstaller
          & $python -m pip install --upgrade torch torchvision torch_tensorrt --extra-index-url $env:TORCH_INDEX_URL --extra-index-url $env:NVIDIA_PYPI_URL
          & $python -m pip install --upgrade $env:VAPOURSYNTH_PACKAGE_SPEC ".\extern\vs-rife"
          & $python -m pip check

          & $python -m pip install --upgrade `
            --target $env:RUNTIME_SITE_PACKAGES `
            packaging setuptools wheel $env:VAPOURSYNTH_PACKAGE_SPEC ".\extern\vs-rife"
          $vapourSynthPackage = Join-Path $env:RUNTIME_SITE_PACKAGES "vapoursynth"
          $vapourSynthBundle = Join-Path $env:BUNDLE_ROOT "libs\vapoursynth"
          if (-not (Test-Path (Join-Path $vapourSynthPackage "vspipe.exe"))) {
            throw "Installed VapourSynth package did not contain vspipe.exe."
          }
          Copy-Item -Recurse -Force -Path (Join-Path $vapourSynthPackage "*") -Destination $vapourSynthBundle
          & $python -m pip install --upgrade `
            --target $env:RUNTIME_SITE_PACKAGES `
            torch torchvision torch_tensorrt `
            --extra-index-url $env:TORCH_INDEX_URL `
            --extra-index-url $env:NVIDIA_PYPI_URL

      - name: Install VapourSynth misc plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-Native {
            param(
              [Parameter(Mandatory)] [string] $FilePath,
              [Parameter(ValueFromRemainingArguments = $true)] [string[]] $Arguments
            )

            & $FilePath @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed with exit code $LASTEXITCODE`: $FilePath $($Arguments -join ' ')"
            }
          }

          $python = ".\.venv-build\Scripts\python.exe"
          $scriptsDir = Split-Path $python
          $vsrepo = Join-Path $scriptsDir "vsrepo.exe"

          Invoke-Native $python -m pip install --upgrade vsrepo

          if (-not (Test-Path $vsrepo)) {
            throw "vsrepo.exe was not found after installing vsrepo: $vsrepo"
          }

          # vsrife uses misc.SCDetect for scene-change detection.
          # That namespace comes from MiscFilters.dll.
          Invoke-Native $vsrepo update
          Invoke-Native $vsrepo install misc

          $vsPluginDir = & $python -c "import vapoursynth as vs; print(vs.get_plugin_dir())"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve VapourSynth plugin dir."
          }

          $vsPluginDir = $vsPluginDir.Trim()
          if (-not (Test-Path $vsPluginDir)) {
            throw "VapourSynth plugin dir does not exist: $vsPluginDir"
          }

          $miscPlugin = Get-ChildItem -Path $vsPluginDir -Recurse -Include "MiscFilters.dll", "*Misc*.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $miscPlugin) {
            Write-Host "Plugin dir contents:"
            Get-ChildItem -Path $vsPluginDir -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host $_.FullName
            }
            throw "vsrepo install misc completed, but MiscFilters.dll was not found in: $vsPluginDir"
          }

          $bundlePluginDir = Join-Path $env:BUNDLE_ROOT "libs\vapoursynth\vs-plugins"
          New-Item -ItemType Directory -Force -Path $bundlePluginDir | Out-Null
          Copy-Item -Force -Path $miscPlugin.FullName -Destination $bundlePluginDir

          Write-Host "Bundled VapourSynth misc plugin:"
          Write-Host "$($miscPlugin.FullName) -> $bundlePluginDir"

      - name: Copy embedded Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pythonHome = python -c "import sys; print(sys.base_prefix)"
          $runtimeRoot = Join-Path $env:BUNDLE_ROOT "python-runtime"
          Copy-Item -Recurse -Force -Path (Join-Path $pythonHome "DLLs") -Destination $runtimeRoot
          Copy-Item -Recurse -Force -Path (Join-Path $pythonHome "Lib") -Destination $runtimeRoot
          Copy-Item -Force -Path (Join-Path $pythonHome "python.exe") -Destination $runtimeRoot
          Copy-Item -Force -Path (Join-Path $pythonHome "pythonw.exe") -Destination $runtimeRoot -ErrorAction SilentlyContinue
          Copy-Item -Force -Path (Join-Path $pythonHome "python*.dll") -Destination $runtimeRoot
          Copy-Item -Force -Path (Join-Path $pythonHome "python*.*") -Destination $runtimeRoot -ErrorAction SilentlyContinue
          Copy-Item -Force -Path (Join-Path $pythonHome "vcruntime*.dll") -Destination $runtimeRoot -ErrorAction SilentlyContinue

      - name: Build onedir app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = ".\.venv-build\Scripts\python.exe"
          & $python -m PyInstaller `
            --clean `
            --onedir `
            --name VidSmoother `
            --paths ".\extern\vs-rife" `
            --add-data "$env:BUNDLE_ROOT\libs;libs" `
            --add-data "$env:BUNDLE_ROOT\python;python" `
            --add-data "$env:BUNDLE_ROOT\python-runtime;python-runtime" `
            ".\main.py"

      - name: Configure bundled VapourSynth Python binding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = ".\dist\VidSmoother"
          $internalRoot = Join-Path $appRoot "_internal"

          if (-not (Test-Path $internalRoot)) {
            $internalRoot = $appRoot
          }

          $vsRoot = Join-Path $internalRoot "libs\vapoursynth"
          $runtimeRoot = Join-Path $internalRoot "python-runtime"
          $sitePackages = Join-Path $internalRoot "python\site-packages"

          $vspipe = Join-Path $vsRoot "vspipe.exe"

          if (-not (Test-Path $vspipe)) {
            throw "vspipe.exe not found: $vspipe"
          }

          $env:PYTHONHOME = (Resolve-Path $runtimeRoot).Path
          $env:PYTHONPATH = (Resolve-Path $sitePackages).Path
          $env:PATH = "$runtimeRoot;$vsRoot;$sitePackages;$env:PATH"
          $env:VAPOURSYNTH_EXTRA_PLUGIN_PATH = (Resolve-Path (Join-Path $vsRoot "vs-plugins")).Path

          # Use the VapourSynth CLI beside the bundled vspipe if present.
          $vapoursynthExe = Get-ChildItem -Path $vsRoot -Recurse -Filter "vapoursynth.exe" |
            Select-Object -First 1

          if ($null -eq $vapoursynthExe) {
            throw "vapoursynth.exe not found in bundled VapourSynth folder. The PyPI package layout changed or it was trimmed."
          }

          & $vapoursynthExe.FullName config
          if ($LASTEXITCODE -ne 0) {
            throw "vapoursynth config failed with exit code $LASTEXITCODE"
          }

          & $vspipe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled vspipe failed after vapoursynth config"
          }

      - name: Smoke test exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\VidSmoother\VidSmoother.exe --help

          $pluginDir = Join-Path ".\dist\VidSmoother\_internal\libs\vapoursynth\vs-plugins" ""
          if (-not (Test-Path $pluginDir)) {
            $pluginDir = Join-Path ".\dist\VidSmoother\libs\vapoursynth\vs-plugins" ""
          }

          if (-not (Get-ChildItem -Path $pluginDir -Recurse -Filter "MiscFilters.dll" -ErrorAction SilentlyContinue)) {
            throw "Bundled release is missing MiscFilters.dll"
          }

          if (-not (Get-ChildItem -Path $pluginDir -Recurse -Include "*lsmash*.dll", "LSMASHSource.dll" -ErrorAction SilentlyContinue)) {
            throw "Bundled release is missing L-SMASH VapourSynth plugin dll"
          }

          $vsRoot = ".\dist\VidSmoother\_internal\libs\vapoursynth"
          if (-not (Test-Path $vsRoot)) {
            $vsRoot = ".\dist\VidSmoother\libs\vapoursynth"
          }

          $runtimeRoot = ".\dist\VidSmoother\_internal\python-runtime"
          if (-not (Test-Path $runtimeRoot)) {
            $runtimeRoot = ".\dist\VidSmoother\python-runtime"
          }

          $sitePackages = ".\dist\VidSmoother\_internal\python\site-packages"
          if (-not (Test-Path $sitePackages)) {
            $sitePackages = ".\dist\VidSmoother\python\site-packages"
          }

          $env:PYTHONHOME = (Resolve-Path $runtimeRoot).Path
          $env:PYTHONPATH = (Resolve-Path $sitePackages).Path
          $env:PATH = "$runtimeRoot;$vsRoot;$sitePackages;$env:PATH"
          $env:VAPOURSYNTH_EXTRA_PLUGIN_PATH = (Resolve-Path (Join-Path $vsRoot "vs-plugins")).Path

          & (Join-Path $vsRoot "vspipe.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled vspipe could not initialize VSScript"
          }

      - name: Create release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:RUNNER_TEMP "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Recurse -Force -Path ".\dist\VidSmoother" -Destination $releaseDir

          $notes = @"
          VidSmoother Windows 11 NVIDIA package

          Included binary components:
          - Python: ${{ inputs.python_version }} embedded runtime from actions/setup-python
          - FFmpeg: $env:BTBN_FFMPEG_BUILDS_TAG ($env:BTBN_FFMPEG_BUILDS_ASSET)
          - VapourSynth: $env:VAPOURSYNTH_VERSION_LABEL Python package
          - L-SMASH-Works: $env:HOMEOFAVISYNTHPLUSEVOLUTION_L_SMASH_WORKS_TAG ($env:HOMEOFAVISYNTHPLUSEVOLUTION_L_SMASH_WORKS_ASSET)
          - MiscFilters VapourSynth plugin for misc.SCDetect / vsrife scene-change detection
          - Python runtime/packages are bundled beside VidSmoother.exe by PyInstaller onedir mode.

          Target machine requirements:
          - Windows 11
          - NVIDIA GPU with a current NVIDIA driver

          Usage:
          - Download all .7z parts.
          - Extract the .7z.001 file with 7-Zip.
          - Run VidSmoother.exe --dry-run to verify commands.
          - Run VidSmoother.exe --overwrite to process videos.

          This workflow is manual-only and is not triggered by pushes, pull requests, tags, or releases.
          "@
          $notes | Set-Content -Path (Join-Path $releaseDir "README.txt") -Encoding ASCII

          $archiveBaseName = "$($env:PACKAGE_NAME)-${{ inputs.version }}.7z"
          $archiveBasePath = Join-Path $env:RUNNER_TEMP $archiveBaseName

          Push-Location $releaseDir

          # Use .7z instead of .zip and split into <2GB chunks for GitHub Release asset limits.
          # 1900m leaves margin below 2,147,483,648 bytes.
          7z a `
            -t7z `
            -mx=9 `
            -m0=LZMA2 `
            -md=256m `
            -mfb=64 `
            -ms=on `
            -v1900m `
            $archiveBasePath `
            *

          Pop-Location

          $archiveParts = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "$archiveBaseName.*" | Sort-Object Name
          if (-not $archiveParts -or $archiveParts.Count -eq 0) {
            throw "Release archive parts were not created."
          }

          foreach ($part in $archiveParts) {
            if ($part.Length -ge 2147483648) {
              throw "Archive part too large for GitHub release asset limit: $($part.FullName) is $($part.Length) bytes"
            }
          }

          "RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARCHIVE_GLOB=$env:RUNNER_TEMP\$archiveBaseName.*" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Created archive parts:"
          $archiveParts | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ inputs.version }}
          path: ${{ env.ARCHIVE_GLOB }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: VidSmoother ${{ inputs.version }} Windows 11 NVIDIA
          files: ${{ env.ARCHIVE_GLOB }}
          make_latest: false
          generate_release_notes: true
