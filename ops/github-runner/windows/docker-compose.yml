services:
  github-runner:
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.333.1}
    image: vidsmoother/github-runner-windows:${RUNNER_VERSION:-2.333.1}
    container_name: vidsmoother-github-runner-windows
    isolation: process
    restart: unless-stopped
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-BrandonCasa/VidSmoother}
      GITHUB_PAT: ${GITHUB_PAT}
      RUNNER_NAME: ${RUNNER_NAME:-vidsmoother-windows-docker}
      RUNNER_LABELS: ${RUNNER_LABELS:-vidsmoother-windows-docker}
      RUNNER_WORKDIR: C:\runner-work
      RUNNER_REPLACE: ${RUNNER_REPLACE:-true}
    volumes:
      - runner-work:C:\runner-work

volumes:
  runner-work:
